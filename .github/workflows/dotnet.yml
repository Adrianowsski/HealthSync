name: .NET CI
on: [push, pull_request]

jobs:
  build_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: dotnet --info

      - name: Restore
        shell: bash
        run: |
          git ls-files '*.sln' > sln.txt || true
          if [ -s sln.txt ]; then
            xargs -a sln.txt -I {} dotnet restore "{}"
          else
            git ls-files '*.csproj' > proj.txt || true
            xargs -a proj.txt -I {} dotnet restore "{}"
          fi

      - name: Build (Release)
        shell: bash
        run: |
          git ls-files '*.sln' > sln.txt || true
          if [ -s sln.txt ]; then
            xargs -a sln.txt -I {} dotnet build "{}" -c Release --no-restore --nologo
          else
            git ls-files '*.csproj' | grep -iv "Tests.csproj" > build.txt || true
            xargs -a build.txt -I {} dotnet build "{}" -c Release --no-restore --nologo
          fi

      - name: Find test projects
        id: findtests
        shell: bash
        run: |
          git ls-files '*Tests.csproj' > tests.txt || true
          echo "count=$(wc -l < tests.txt)" >> "$GITHUB_OUTPUT"
          cat tests.txt || true

      - name: Test
        if: steps.findtests.outputs.count != '0'
        run: xargs -a tests.txt -I {} dotnet test "{}" -c Release --no-build --logger "trx;LogFileName=test.trx"
