name: Build & Test (.NET 8 + SQL)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: Your_strong_password_123
          ACCEPT_EULA: "Y"
        ports:
          - 1433:1433
        # Prosty healthcheck portu - kontener startuje szybko, ale dajmy mu chwile
        options: >-
          --health-cmd "bash -c 'echo > /dev/tcp/127.0.0.1/1433 || exit 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      # Zmiennie dla testu:
      MSSQL_HOST: "localhost,1433"
      MSSQL_SA_USER: "sa"
      MSSQL_SA_PASSWORD: "Your_strong_password_123"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: |
          dotnet restore HealthSync.sln || true
          dotnet restore tests/HealthSync.IntegrationTests/HealthSync.IntegrationTests.csproj

      - name: Build solution (apps/libs)
        run: |
          dotnet build HealthSync.sln -c Release || echo "Solution build warnings/skip ok"

      - name: Wait for SQL to be ready
        run: |
          for i in {1..60}; do
            (echo > /dev/tcp/127.0.0.1/1433) >/dev/null 2>&1 && echo "SQL is ready" && break
            echo "Waiting for SQL..."
            sleep 2
          done

      - name: Test (integration)
        run: |
          dotnet test tests/HealthSync.IntegrationTests/HealthSync.IntegrationTests.csproj -c Release --logger "trx;LogFileName=test-results.trx"
