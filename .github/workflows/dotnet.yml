name: .NET CI
on: [push, pull_request]

jobs:
  build_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: dotnet --info
        run: dotnet --info

      # Zbierz wszystkie .csproj
      - name: Find projects
        id: findproj
        shell: bash
        run: |
          git ls-files '*.csproj' > projects.txt || true
          echo "count=$(wc -l < projects.txt)" >> "$GITHUB_OUTPUT"
          cat projects.txt

      - name: Restore
        if: steps.findproj.outputs.count != '0'
        run: xargs -a projects.txt -I {} dotnet restore "{}"

      - name: Build
        if: steps.findproj.outputs.count != '0'
        run: xargs -a projects.txt -I {} dotnet build "{}" -c Release --no-restore --nologo

      # Testy (jeśli dodasz *Tests.csproj)
      - name: Find test projects
        id: findtests
        shell: bash
        run: |
          git ls-files '*Tests.csproj' > tests.txt || true
          echo "count=$(wc -l < tests.txt)" >> "$GITHUB_OUTPUT"

      - name: Test
        if: steps.findtests.outputs.count != '0'
        run: xargs -a tests.txt -I {} dotnet test "{}" -c Release --no-build --logger "trx;LogFileName=test.trx"
