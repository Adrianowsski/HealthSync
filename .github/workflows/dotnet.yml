name: .NET CI

on:
  push:
    branches: [ "main", "refactor/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: Your_strong_password_123
          ACCEPT_EULA: "Y"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "bash -lc 'echo > /dev/tcp/127.0.0.1/1433 || exit 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      MSSQL_HOST: "localhost,1433"
      MSSQL_SA_USER: "sa"
      MSSQL_SA_PASSWORD: "Your_strong_password_123"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        shell: bash
        run: |
          git ls-files '*.csproj' > proj.txt
          xargs -a proj.txt -I {} dotnet restore "{}"

      - name: Build (Release)
        shell: bash
        run: |
          git ls-files '*.csproj' | grep -iv "Tests.csproj" > build.txt || true
          if [ -s build.txt ]; then
            xargs -a build.txt -I {} dotnet build "{}" -c Release --no-restore
          else
            echo "No app projects to build (ok)."
          fi

      - name: Wait for SQL
        run: |
          for i in {1..60}; do
            (echo > /dev/tcp/127.0.0.1/1433) >/dev/null 2>&1 && echo "SQL is ready" && break
            echo "Waiting for SQL..."
            sleep 2
          done

      - name: Find test projects
        id: findtests
        run: |
          git ls-files '*Tests.csproj' > tests.txt || true
          echo "count=$(wc -l < tests.txt)" >> "$GITHUB_OUTPUT"
          cat tests.txt || true

      - name: Test
        if: steps.findtests.outputs.count != '0'
        run: xargs -a tests.txt -I {} dotnet test "{}" -c Release --no-build --logger "trx;LogFileName=test.trx"
