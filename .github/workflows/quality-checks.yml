name: Quality Checks – Unit & Integration

on:
  push:
    branches: ["main", "refactor/**"]
    paths:
      - "tests/**"
      - ".github/workflows/quality-checks.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "tests/**"
      - ".github/workflows/quality-checks.yml"

concurrency:
  group: qc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: Your_strong_password_123
          ACCEPT_EULA: "Y"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "bash -lc 'echo > /dev/tcp/127.0.0.1/1433 || exit 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      MSSQL_HOST: "localhost,1433"
      MSSQL_SA_USER: "sa"
      MSSQL_SA_PASSWORD: "Your_strong_password_123"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Discover test projects
        id: discover
        shell: bash
        run: |
          git ls-files "tests/**/*.csproj" > tests.txt || true
          echo "count=$(wc -l < tests.txt)" >> $GITHUB_OUTPUT
          cat tests.txt

      - name: Restore
        if: steps.discover.outputs.count != '0'
        run: xargs -a tests.txt -I {} dotnet restore "{}"

      - name: Build (Release)
        if: steps.discover.outputs.count != '0'
        run: xargs -a tests.txt -I {} dotnet build "{}" -c Release --no-restore /p:TreatWarningsAsErrors=false

      - name: Wait for SQL (port check)
        shell: bash
        run: |
          for i in {1..60}; do
            (echo > /dev/tcp/127.0.0.1/1433) >/dev/null 2>&1 && echo "SQL is ready" && break
            echo "Waiting for SQL..."; sleep 2
          done

      - name: Test
        if: steps.discover.outputs.count != '0'
        run: xargs -a tests.txt -I {} dotnet test "{}" -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qc-test-results
          path: |
            **/TestResults/*.trx
            **/test-results.trx
          if-no-files-found: ignore
