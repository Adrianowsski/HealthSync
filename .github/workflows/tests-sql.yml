name: Tests – SQL Server (Integration)

on:
  push:
    branches: ["main", "refactor/**"]
    paths:
      - "tests/**"
      - ".github/workflows/tests-sql.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "tests/**"
      - ".github/workflows/tests-sql.yml"

concurrency:
  group: tests-sql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_sql:
    name: Run SQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: Your_strong_password_123
          ACCEPT_EULA: "Y"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "bash -lc 'echo > /dev/tcp/127.0.0.1/1433 || exit 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      MSSQL_HOST: "localhost,1433"
      MSSQL_SA_USER: "sa"
      MSSQL_SA_PASSWORD: "Your_strong_password_123"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore test project
        run: dotnet restore tests/HealthSync.IntegrationTests/HealthSync.IntegrationTests.csproj

      - name: Build test project (Release)
        run: dotnet build tests/HealthSync.IntegrationTests/HealthSync.IntegrationTests.csproj -c Release --no-restore

      - name: Wait for SQL (port check)
        shell: bash
        run: |
          for i in {1..60}; do
            (echo > /dev/tcp/127.0.0.1/1433) >/dev/null 2>&1 && echo "SQL is ready" && break
            echo "Waiting for SQL..."
            sleep 2
          done

      - name: Run integration tests
        run: dotnet test tests/HealthSync.IntegrationTests/HealthSync.IntegrationTests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-sql
          path: |
            **/TestResults/*.trx
            **/test-results.trx
          if-no-files-found: ignore
